[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "czsc-execution-channels"
version = "0.1.0"
description = "Market rules, order planning and historical/Futu execution accounts"
requires-python = ">=3.12"
dependencies = ["pandas>=3.0.3,<4", "numpy>=2.4.6"]

[project.optional-dependencies]
futu = ["futu-api==10.10.7008"]
test = ["pytest>=8.0", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/functional"]
addopts = "--tb=short -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
