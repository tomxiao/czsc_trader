[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "czsc-factor-signal-catalog"
version = "0.1.0"
description = "Project-level factor and signal definitions and deterministic factor calculations"
requires-python = ">=3.12"
dependencies = ["numpy>=2.4.6", "pandas>=3.0.3,<4"]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/functional"]
addopts = "--tb=short -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
