[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "czsc-strategy-runtime"
version = "0.1.0"
description = "Stable strategy runtime contracts shared by research and execution hosts"
requires-python = ">=3.12"
dependencies = [
    "czsc==1.0.1",
    "czsc-dataflows==0.1.0",
    "pandas>=3.0.3,<4",
    "python-dotenv>=1.0.0",
]

[project.scripts]
srt-prepare = "strategy_runtime.prepare_cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/functional"]
addopts = "--tb=short -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
