[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-trading-engine"
version = "0.1.0"
description = "Broker-neutral paper trading operations engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "futu-api==10.10.7008",
    "plotly==6.9.0",
    "czsc-dataflows==0.1.0",
    "czsc-strategy-runtime==0.1.0",
    "czsc-strategy-manager==0.1.0",
    "python-dotenv>=1.0.0",
    "pywin32>=308; platform_system == 'Windows'",
]

[project.scripts]
pte = "paper_trading_engine.cli:main"
pte-watchdog = "paper_trading_engine.windows_service:main"
pte-release = "paper_trading_engine.release_cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_trading_engine = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests/functional"]
addopts = "--tb=short -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
