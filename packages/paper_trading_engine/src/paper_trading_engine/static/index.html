<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PTE · 模拟交易控制台</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/events.css">
</head>
<body>
  <header class="system-bar">
    <a class="brand" href="/accounts/" aria-label="PTE首页"><span>PTE</span><strong>模拟交易控制台</strong></a>
    <nav aria-label="一级导航"><a data-nav="account" href="/accounts/">虚拟账户</a><a data-nav="channel" href="/channels/futu-simulate-cn">Futu模拟盘CN</a><a data-nav="audit" href="/audit-events">审计事件</a><a data-nav="comparison" href="/comparison">账户比较</a></nav>
    <span id="releaseVersion" class="release-version" aria-label="当前PTE版本">版本加载中</span>
    <button id="systemStatus" class="system-status" type="button" aria-live="polite" aria-haspopup="dialog">系统状态加载中</button>
  </header>
  <div id="pollWarning" class="alert" role="status" hidden></div>
  <div id="routeLoading" class="route-loading" role="status" hidden></div>
  <main id="app" aria-live="polite"><div class="loading">正在加载控制台…</div></main>
  <dialog id="systemEventsDialog" class="events-dialog" aria-labelledby="systemEventsTitle">
    <div class="events-head"><div><div class="eyebrow">PTE 运行审计</div><h2 id="systemEventsTitle">系统事件</h2></div><button id="closeSystemEvents" class="button" type="button">关闭</button></div>
    <div id="systemEventsContent" class="events-content"><div class="loading">正在加载系统事件…</div></div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/static/app.js"></script>
</body></html>
