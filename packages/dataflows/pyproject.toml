[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "czsc-dataflows"
version = "0.1.0"
description = "Reusable financial market-data adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "stockstats>=0.6.5",
    "tushare>=1.4.29",
]

[tool.setuptools.packages.find]
where = ["src"]
