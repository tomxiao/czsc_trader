    const cross=add(el('line',{y1:priceTop,y2:explainTop+explainH,class:'crosshair'})),priceDot=add(el('circle',{r:4,fill:css('--text'),stroke:css('--surface'),'stroke-width':2})),signalDot=add(el('circle',{r:4,fill:css('--signal'),stroke:css('--surface'),'stroke-width':2})),main=add(el('text',{x:left+12,y:explainTop+22,class:'explain-main'})),sub=add(el('text',{x:left+12,y:explainTop+42,class:'explain-sub'}));
    function select(index,pointer){index=Math.max(0,Math.min(rows.length-1,index));state.selected=rows[index].date;const row=rows[index],decision=byDate.get(row.date),observation=decision?.observation;cross.setAttribute('x1',x(index));cross.setAttribute('x2',x(index));priceDot.setAttribute('cx',x(index));priceDot.setAttribute('cy',yPrice(row.close));const first=observation?.status==='READY'?observation.series?.[0]:null;signalDot.style.display=first?'':'none';if(first){signalDot.setAttribute('cx',x(index));signalDot.setAttribute('cy',ySignal(first.value));}const event=decision?actionLabel(decision.action):'无新增事件';main.textContent=`${row.date} · ${event}`;sub.replaceChildren(...explanations[index].map((text,line)=>el('tspan',{x:left+12,dy:line?18:0,'xml:space':'preserve'},text)));tooltip.innerHTML=`<div class="head"><span>${safe(row.date)}</span><span>${safe(event)}</span></div><div class="grid"><span>开 / 高</span><span>${fmt(row.open)} / ${fmt(row.high)}</span><span>低 / 收</span><span>${fmt(row.low)} / ${fmt(row.close)}</span><span>目标仓位</span><span>${decision?`${(Number(decision.observation.target_position)*100).toFixed(0)}%`:"无信号记录"}</span><span>实际持仓</span><span>${snapshotByDate.has(row.date)?`${Number(snapshotByDate.get(row.date).quantity).toLocaleString('zh-CN')} 股`:"无账户记录"}</span><span>执行日</span><span>${safe(decision?.valid_session||"无信号记录")}</span>${fills.filter(item=>item.session===row.date).map(item=>`<span>${safe(item.side==='BUY'?'买入':'卖出')}成交</span><span>${fmt(item.price)} × ${Number(item.quantity).toLocaleString('zh-CN')}股<br>未复权 · ${safe(item.occurred_at.slice(11))}</span>`).join('')}</div>`;if(pointer){tooltip.hidden=false;const tooltipWidth=250,leftPos=pointer[0]+18;tooltip.style.left=`${leftPos+tooltipWidth>width?pointer[0]-tooltipWidth-18:leftPos}px`;tooltip.style.top=`${Math.max(18,Math.min(height-175,pointer[1]-34))}px`;}}
    const selectedIndex=rows.findIndex(row=>row.date===state.selected);
    select(selectedIndex<0?rows.length-1:selectedIndex,null);
    const overlay=add(el('rect',{x:left,y:priceTop,width:innerW,height:explainTop+explainH-priceTop,fill:'transparent'}));overlay.addEventListener('pointermove',event=>{const rect=svg.getBoundingClientRect(),px=(event.clientX-rect.left)*width/rect.width,py=(event.clientY-rect.top)*height/rect.height,index=Math.round((px-left)/innerW*(rows.length-1));select(index,[px,py]);});overlay.addEventListener('pointerleave',()=>{tooltip.hidden=true;});
  }
  document.querySelectorAll('[data-range]').forEach(button=>button.addEventListener('click',()=>{state.range=button.dataset.range==='all'?'all':Number(button.dataset.range);document.querySelectorAll('[data-range]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));render();}));
  document.querySelectorAll('[data-layer]').forEach(button=>button.addEventListener('click',()=>{const layer=button.dataset.layer;state.layers[layer]=!state.layers[layer];button.setAttribute('aria-pressed',String(state.layers[layer]));render();}));
  new ResizeObserver(render).observe(stage);render();
})();
